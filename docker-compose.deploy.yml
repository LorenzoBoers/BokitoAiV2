# Registry-pull deploy stack for VPS (staging + production).
#
# Usage (on VPS at /opt/bokito):
#   docker compose -p bokito --env-file .env.prod \
#     -f docker-compose.deploy.yml -f docker-compose.vps.yml pull
#   docker compose -p bokito --env-file .env.prod \
#     -f docker-compose.deploy.yml -f docker-compose.vps.yml up -d
#
# Staging uses project name `bokito-staging` and .env.staging (port 8089).
# Production keeps project name `bokito` to preserve existing volumes.
#
# Set BOKITO_API_IMAGE and BOKITO_WEB_IMAGE in the env file (written by CI).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bokito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bokito}
    volumes:
      - bokito_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bokito}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bokito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${BOKITO_API_IMAGE:?set BOKITO_API_IMAGE}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${BOKITO_ENV_FILE:-.env.prod}
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    networks:
      default: {}
      bokito_shared:
        aliases:
          - bokito-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - bokito_uploads:/app/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    image: ${BOKITO_API_IMAGE:?set BOKITO_API_IMAGE}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${BOKITO_ENV_FILE:-.env.prod}
    networks:
      - default
      - bokito_shared
    environment:
      TRIGGER_SCHEDULER_ENABLED: "false"
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "arq", "app.workers.tasks.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - bokito_uploads:/app/data/uploads
    command: arq app.workers.tasks.WorkerSettings

  # Agent web_search backend. Internal only (no host ports).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Agent fetch_url backend (page → Markdown). Internal only; needs shm for Chromium.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    restart: unless-stopped
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:11235/health || curl -sf http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    image: ${BOKITO_WEB_IMAGE:?set BOKITO_WEB_IMAGE}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${BOKITO_ENV_FILE:-.env.prod}
    environment:
      BOKITO_DOMAIN: ${BOKITO_DOMAIN:-:80}
    ports:
      - "127.0.0.1:${BOKITO_WEB_PORT:-8088}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bokito_pg_data:
  bokito_redis_data:
  bokito_uploads:
  caddy_data:
  caddy_config:

networks:
  bokito_shared:
    external: true
