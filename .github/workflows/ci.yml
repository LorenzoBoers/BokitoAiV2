name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: apps/api
        run: ruff check app tests
      - name: Pytest
        working-directory: apps/api
        env:
          LLM_MODE: mock
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          PYTHONUNBUFFERED: "1"
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck dashboard
        run: npx tsc --noEmit -p apps/dashboard
      - name: Lint dashboard
        run: npm run lint -w bokito-dashboard
      - name: Test dashboard
        run: npm test -w bokito-dashboard
      - name: Build dashboard
        run: npm run build:dashboard
        env:
          VITE_BOKITO_API_URL: http://127.0.0.1:8000

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck shared UI packages
        run: npx tsc --noEmit -p packages/ui-tokens/tsconfig.json && npx tsc --noEmit -p packages/ui/tsconfig.json
      - name: Token snapshot and UI tests
        run: npm test -w @bokito/ui-tokens && npm test -w @bokito/ui
      - name: UI boundary check
        run: npm run boundaries -w @bokito/ui

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Bundle mobile workspace packages
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/bokito-mobile-export

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (bokito stack)
        run: npm run test:e2e
        env:
          CI: 'true'
