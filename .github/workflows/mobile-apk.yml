name: Mobile APK

on:
  workflow_dispatch:

concurrency:
  group: mobile-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON not set; push may not work on the built APK"
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prepare managed EAS build
        working-directory: apps/mobile
        run: |
          # Committed android/ is for local Windows dev only. EAS managed prebuild
          # (last successful CI APK) must not upload the bare native tree.
          rm -rf android ios

      - name: Build Android APK (EAS preview)
        id: eas_build
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if ! eas build -p android --profile preview --non-interactive --wait --json > build-output.json; then
            echo "EAS build failed. Output:"
            cat build-output.json || true
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('build-output.json', 'utf8');
          const parsed = JSON.parse(raw);
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url =
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifacts?.buildUrl ||
            '';
          if (!url) {
            console.error('No APK artifact URL in EAS build output');
            console.error(raw);
            process.exit(1);
          }
          fs.writeFileSync('apk-url.txt', url);
          NODE

      - name: Download APK artifact
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          curl -fsSL "$(cat apk-url.txt)" -o bokito-mobile.apk
          ls -lh bokito-mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bokito-android-apk
          path: apps/mobile/bokito-mobile.apk
          retention-days: 30

      - name: Upload EAS build metadata
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-metadata
          path: apps/mobile/build-output.json
          retention-days: 14
