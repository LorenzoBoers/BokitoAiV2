services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bokito
      POSTGRES_PASSWORD: bokito
      POSTGRES_DB: bokito
    ports:
      - "5432:5432"
    volumes:
      - bokito_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bokito"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bokito:bokito@postgres:5432/bokito
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: mock
      JWT_SECRET: dev-jwt-secret
      CORS_ORIGINS: http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:5174,http://localhost:5175
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://bokito:bokito@postgres:5432/bokito
      REDIS_URL: redis://redis:6379/0
      LLM_MODE: mock
      JWT_SECRET: dev-jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.tasks.WorkerSettings

  dashboard:
    image: node:20-alpine
    working_dir: /app/apps/dashboard
    volumes:
      - .:/app
    ports:
      - "5174:5174"
    environment:
      VITE_API_MODE: bokito
      VITE_BOKITO_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

  messenger:
    image: node:20-alpine
    working_dir: /app/apps/messenger
    volumes:
      - .:/app
    ports:
      - "5175:5175"
    environment:
      VITE_BOKITO_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  bokito_pg_data:
