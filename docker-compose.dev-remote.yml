# Postgres + Redis for the VPS hot-reload checkout (/opt/bokito-dev).
# Bound to localhost only. Does not touch the prod or staging compose projects.
# API and Vite run on the host (systemd), not in these containers.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bokito
      POSTGRES_PASSWORD: ${BOKITO_DEV_DB_PASSWORD}
      POSTGRES_DB: bokito
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bokito_dev_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bokito"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bokito_dev_pg:
