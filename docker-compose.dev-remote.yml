# Postgres + Redis (+ agent web tools) for the VPS hot-reload checkout (/opt/bokito-dev).
# Bound to localhost only. Does not touch the prod or staging compose projects.
# API and Vite run on the host (systemd), not in these containers.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bokito
      POSTGRES_PASSWORD: ${BOKITO_DEV_DB_PASSWORD}
      POSTGRES_DB: bokito
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bokito_dev_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bokito"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Agent web_search. Host API: SEARXNG_URL=http://127.0.0.1:8888
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-bokito-dev-searxng-secret}
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Agent fetch_url. Host API: CRAWL4AI_URL=http://127.0.0.1:11235
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    restart: unless-stopped
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-bokito-dev-crawl4ai-token}
    ports:
      - "127.0.0.1:11235:11235"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:11235/health || curl -sf http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  bokito_dev_pg:
