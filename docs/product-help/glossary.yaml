# Operator vocabulary for Bokito. UI copy, product-help and mobile strings
# come from this list. check-copy.mjs fails the dashboard lint when a
# forbidden synonym shows up in locale values, product-help or mobile copy.
#
# Code and table names stay (Signal, Project, Workstream, Department).
# URL slugs stay English.

terms:
  - id: conversation
    nl: Gesprek
    en: Conversation
    code: Signal
    api: /api/signals
    slug: /communication
    forbidden: []
  - id: folder
    # The place where all work on one subject lands: a client, a project or a
    # department task. Mailbox and Drive folders also use "map" in NL; Drive
    # copy says "Drive-map" or "een map buiten Bokito".
    nl: Map
    en: Folder
    code: Project
    api: /api/folders
    slug: /folders
    forbidden: ["Projecten", "Projects", "Werkmap", "Werkmappen"]
  - id: works_in
    # Everything inside a folder where its work is done: board, files and
    # canvases in Bokito, and connections such as a repository or Exact.
    nl: Werkt in
    en: Works in
    code: ProjectResource
    api: /api/folders
    slug: /folders
    forbidden: []
  - id: delivered
    # What a conversation produced, shown in the thread and on the Grid.
    nl: Opgeleverd
    en: Delivered
    code: SignalEvent
    api: ""
    slug: ""
    forbidden: []
  - id: flow
    # Stage pipeline for one label. Dutch noun is "werk" (het werk; UI uses singular/collective, not "werken").
    # English stays Flow. Do not put Flow on forbidden: EN copy still uses it.
    nl: Werk
    en: Flow
    code: Workstream
    api: /api/flows
    slug: /flows
    forbidden: ["Playbook", "Playbooks", "actietag", "action tag", "action-tag"]
  - id: label
    nl: Label
    en: Label
    code: SignalTag
    api: /api/labels
    slug: /settings/labels
    forbidden: []
  - id: ticket
    nl: Ticket
    en: Ticket
    code: Signal
    api: /api/signals
    slug: ""
    forbidden: []
  - id: department
    nl: Afdeling
    en: Department
    code: Department
    api: /api/departments
    slug: /workforce
    forbidden: []
  - id: agent
    nl: Agent
    en: Agent
    code: Agent
    api: /api/workforce/agents
    slug: /agents
    forbidden: []
  - id: autonomy
    nl: Autonomie
    en: Autonomy
    code: ai_handling
    api: /api/settings/autonomy
    slug: /settings/govern
    forbidden: ["AI-antwoordinstellingen", "AI-afhandeling", "AI handling", "AI-handling"]
  - id: effort
    nl: Denkwerk
    en: Thinking
    code: effort
    api: /api/workforce/agents/{id}/definition
    slug: /agents
    forbidden: ["Denkbudget", "thinking budget", "Thinking budget"]
  - id: today
    nl: Vandaag
    en: Today
    code: cockpit
    api: /api/cockpit
    slug: /communication/today
    forbidden: []
  - id: for_you
    nl: Voor jou
    en: For you
    code: for_you
    api: /api/signals
    slug: /communication/inbox/for_you
    forbidden: ["Jij bent nodig", "Needs you"]
  - id: new_conversation
    nl: Nieuw gesprek
    en: New conversation
    code: ""
    api: ""
    slug: /new
    forbidden: ["New chat", "Nieuwe chat starten", "Nieuwe chat"]
  - id: connections
    nl: Koppelingen
    en: Connections
    code: ""
    api: /api/integrations
    slug: /settings/connections
    forbidden: ["Integraties", "Integrations"]
  - id: knowledge
    nl: Kennis
    en: Knowledge
    code: ""
    api: ""
    slug: /agents/knowledge
    forbidden: []
  - id: log
    nl: Logboek
    en: Log
    code: UsageLedger
    api: ""
    slug: /settings/govern
    forbidden: ["Ledger"]
  - id: safeguards
    nl: Waarborgen
    en: Safeguards
    code: ai_handling.safeguards
    api: /api/ai-handling/settings
    slug: /settings/govern
    forbidden: []
  - id: decision
    nl: Beslissing
    en: Decision
    code: DecisionRequest
    api: /api/notifications
    slug: ""
    forbidden: []

# Whole words that must not appear in Dutch UI values.
# Loanwords that stay: Agents, Govern, Workforce, Bokito, and product names.
# Flow/Flows stay off the all-language forbidden list (EN still uses them);
# they are listed here so Dutch copy cannot keep the old loanword.
nl_forbidden_words:
  - Files
  - Marketplace
  - Skills
  - Playbook
  - Playbooks
  - Projects
  - Project
  - Overview
  - Teams
  - Flow
  - Flows
  - flow
  - flows

# Phrases the glossary rewrite produced. They must not come back.
bad_outcomes:
  - "Logboek in"
  - "Logboek uit"
  - "Logboek opnieuw"
  - "Logboek eerst"
  - "an today"
  - "Foldermappen"
  - "de Aanbod"
  - "/docs/connections/"
  - "Rapport"
  - "werkmap"
  - "Werkmap"
  - "werkmappen"
  - "Werkmappen"
  - "Werkmapagent"
  - "Werkmaplead"
  - "werkmapwachtrij"
  - "Nieuwe flow"
  - "de flow"
  - "een flow"
  - "Geen flow"
  - "Nog geen flows"
  - "Werken"
  - "Alle werken"
  - "Nog geen werken"

loanwords:
  - Agents
  - Govern
  - Workforce
  - Bokito
  - API
  - URL
  - MCP
  - HTTP
  - WhatsApp
  - Slack
  - GitHub
  - Exact
  - AI
