# Bokito V2 on the VPS: registry images, one env file, own volumes.
# Two projects share this file:
#   staging: docker compose -p bokito-v2-staging --env-file .env.v2-staging -f docker-compose.v2.deploy.yml up -d
#   prod:    docker compose -p bokito-v2 --env-file .env.v2 -f docker-compose.v2.deploy.yml up -d
# Host Caddy: v2-staging.bokito.ai -> :8091, v2.bokito.ai -> :8090.
# Use scripts/vps-pull-deploy-v2.sh; it writes the image tags into the env file.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bokito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bokito_v2}
    volumes:
      - pg_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bokito}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_v2_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-v2:
    image: ${BOKITO_API_V2_IMAGE:?set BOKITO_API_V2_IMAGE}
    env_file:
      - ${BOKITO_V2_ENV_FILE:-.env.v2}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bokito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bokito_v2}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/api/health >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker-v2:
    image: ${BOKITO_API_V2_IMAGE:?set BOKITO_API_V2_IMAGE}
    command: ['arq', 'bokito.workers.WorkerSettings']
    env_file:
      - ${BOKITO_V2_ENV_FILE:-.env.v2}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bokito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bokito_v2}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api-v2:
        condition: service_healthy
    restart: unless-stopped

  web-v2:
    image: ${BOKITO_WEB_V2_IMAGE:?set BOKITO_WEB_V2_IMAGE}
    ports:
      - '127.0.0.1:${BOKITO_V2_WEB_PORT:-8090}:80'
    depends_on:
      - api-v2
    restart: unless-stopped

volumes:
  pg_v2_data:
  redis_v2_data:
