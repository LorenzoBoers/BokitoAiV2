name = "bokito-tenant-router"
main = "src/index.js"
compatibility_date = "2024-12-01"
# From Cloudflare dashboard URL /c552958ca40fe9d6b4f45ec7bbba737f/... (required for API token / CI deploy).
account_id = "c552958ca40fe9d6b4f45ec7bbba737f"

# Wildcard route catches all tenant subdomains. The more-specific `app.bokito.ai/*` route
# is owned by `bokito-app-passthrough` and pre-empts this worker for the control plane.
routes = [
  { pattern = "*.bokito.ai/*", zone_name = "bokito.ai" }
]

[vars]
BOKITO_STATIC_ORIGIN = "https://bokitoapp-prod-7443ed-xrex-nmji-j9ur.f2.xano.io"
BOKITO_API_ORIGIN = "https://xrex-nmji-j9ur.f2.xano.io"
