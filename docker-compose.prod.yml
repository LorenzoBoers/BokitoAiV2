# Production stack for a single-VPS 24/7 MVP test.
#
# Deploy:
#   cp .env.prod.example .env.prod   # then fill in real secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# IMPORTANT: run exactly ONE `api` replica. The in-process trigger scheduler
# (app/services/trigger_scheduler.py) has no distributed lock, so multiple API
# replicas would double-fire cron/interval/heartbeat triggers.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bokito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-bokito}
    volumes:
      - bokito_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bokito}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bokito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Nightly pg_dump snapshots. Restore procedure: docs/ops/BACKUP_RESTORE.md.
  # Dumps land in the bokito_pg_backups volume; no ports are exposed.
  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-bokito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-bokito}
      SCHEDULE: "0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "3"
      POSTGRES_EXTRA_OPTS: "-Z6"
    volumes:
      - bokito_pg_backups:/backups

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    healthcheck:
      # Deep readiness: verifies Postgres and Redis connectivity, not just process-up.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready').status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - bokito_uploads:/app/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # The worker never runs the in-process API scheduler loop; keep it off explicitly.
      TRIGGER_SCHEDULER_ENABLED: "false"
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
      crawl4ai:
        condition: service_started
    healthcheck:
      test: ["CMD", "arq", "app.workers.tasks.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - bokito_uploads:/app/data/uploads
    command: arq app.workers.tasks.WorkerSettings

  # Agent web_search backend. Internal only (no host ports).
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Agent fetch_url backend (page → Markdown). Internal only; needs shm for Chromium.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.2
    restart: unless-stopped
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:11235/health || curl -sf http://127.0.0.1:11235/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-mvp}
        VITE_APP_CONTROL_PLANE_HOST: ${VITE_APP_CONTROL_PLANE_HOST:-app.bokito.ai}
        VITE_TENANT_ROOT_DOMAIN: ${VITE_TENANT_ROOT_DOMAIN:-.bokito.ai}
        VITE_APP_CONTROL_PLANE_URL: ${VITE_APP_CONTROL_PLANE_URL:-}
        VITE_PLATFORM_DEFAULT_LANGUAGE: ${VITE_PLATFORM_DEFAULT_LANGUAGE:-nl}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bokito_pg_data:
  bokito_pg_backups:
  bokito_redis_data:
  bokito_uploads:
  caddy_data:
  caddy_config:
