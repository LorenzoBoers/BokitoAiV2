# Production stack for a single-VPS 24/7 MVP test.
#
# Deploy:
#   cp .env.prod.example .env.prod   # then fill in real secrets
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# IMPORTANT: run exactly ONE `api` replica. The in-process trigger scheduler
# (app/services/trigger_scheduler.py) has no distributed lock, so multiple API
# replicas would double-fire cron/interval/heartbeat triggers.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bokito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-bokito}
    volumes:
      - bokito_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bokito}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - bokito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # The worker never runs the in-process API scheduler loop; keep it off explicitly.
      TRIGGER_SCHEDULER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.workers.tasks.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: arq app.workers.tasks.WorkerSettings

  web:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_APP_VERSION: ${VITE_APP_VERSION:-mvp}
        VITE_APP_CONTROL_PLANE_HOST: ${VITE_APP_CONTROL_PLANE_HOST:-app.bokito.ai}
        VITE_TENANT_ROOT_DOMAIN: ${VITE_TENANT_ROOT_DOMAIN:-.bokito.ai}
        VITE_APP_CONTROL_PLANE_URL: ${VITE_APP_CONTROL_PLANE_URL:-}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bokito_pg_data:
  bokito_redis_data:
  caddy_data:
  caddy_config:
