<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bokito AI</title>
  <meta name="description" content="Bokito AI runs conversations, the agenda, and agents for your company." />
  <meta name="theme-color" content="#0c0e12" />
  <link rel="icon" type="image/png" href="/bokito-logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/bokito-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var publicPath = /^\/(login|signup|forgot-password|reset-password)$/;
      function sync() {
        var node = document.getElementById('bokito-about');
        var onPublic = publicPath.test(location.pathname);
        var already = (document.body.innerText || '').indexOf('Bokito AI runs conversations') !== -1;
        if (!onPublic || (already && node)) {
          if (node) node.remove();
          return;
        }
        if (!onPublic || already || node) return;
        var host = document.querySelector('.max-w-sm');
        if (!host) return;
        var p = document.createElement('p');
        p.id = 'bokito-about';
        p.style.cssText = 'margin:16px 0 0;text-align:center;font:12px/1.5 Inter,system-ui,sans-serif;color:#9aa3b5';
        p.appendChild(document.createTextNode('Bokito AI runs conversations, the agenda, and agents for your company. '));
        var a = document.createElement('a');
        a.href = '/privacy.html';
        a.style.color = '#c5cedd';
        a.textContent = 'Privacy';
        p.appendChild(a);
        host.appendChild(p);
      }
      var push = history.pushState;
      history.pushState = function () {
        var result = push.apply(this, arguments);
        sync();
        return result;
      };
      window.addEventListener('popstate', sync);
      var ticks = 0;
      var timer = setInterval(function () {
        sync();
        if (++ticks > 24) clearInterval(timer);
      }, 500);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
