[project]
name = "bokito"
version = "2.0.0"
description = "Bokito V2: the governed conversation layer for companies run with AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.0,<5.0.0",
  "python-multipart>=0.0.12",
  "httpx>=0.28.0",
  "anthropic>=0.42.0",
  "openai>=1.58.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
  "sentry-sdk[fastapi]>=2.19.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pgserver>=0.1.4",
  "psycopg[binary]>=3.2.0",
  "ruff==0.15.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bokito"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Cookie() in defaults is the framework idiom
