<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bokito Chat — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
    }
    .demo-page {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 40px 24px; gap: 32px;
    }
    .demo-header { text-align: center; }
    .demo-header h1 { font-size: 28px; font-weight: 700; color: #1A1A2E; margin-bottom: 8px; }
    .demo-header p  { font-size: 15px; color: #6B7280; }
    .embed-box {
      background: white; border: 1px solid #E5E7EB; border-radius: 16px;
      padding: 28px 32px; max-width: 560px; width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    .embed-box h2 { font-size: 14px; font-weight: 600; color: #6B7280; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 14px; }
    .embed-box pre {
      background: #F8FAFC; border: 1px solid #E5E7EB; border-radius: 10px;
      padding: 14px 16px; font-size: 12px; line-height: 1.6; color: #374151;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }
    .demo-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE;
      border-radius: 100px; padding: 6px 14px; font-size: 13px; font-weight: 500;
    }
    .demo-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #22C55E; flex-shrink: 0; }
    a.demo-back { font-size: 13px; color: #6B7280; text-decoration: none; }
    a.demo-back:hover { color: #0F7CF5; }
  </style>
</head>
<body>
  <div class="demo-page">
    <div class="demo-header">
      <h1>Bokito Chat</h1>
      <p>Click the chat button in the bottom-right corner to start.</p>
      <p style="font-size:13px;color:#64748B;max-width:520px;margin-top:10px">
        Query overrides: <code>?agent_slug=…&amp;api_url=…&amp;tenant=…&amp;auth_mode=anonymous|required</code>.
        Smooth streaming is on by default; disable with <code>?bk_sse_smooth=0</code>.
      </p>
    </div>

    <div class="embed-box">
      <h2>Embed snippet</h2>
      <pre id="embedSnippet"></pre>
    </div>

    <div style="display:flex;align-items:center;gap:16px">
      <span class="demo-badge" id="agentLabel">Connecting...</span>
      <a class="demo-back" href="index.html">← Back to test pages</a>
    </div>
  </div>

  <script>
    // Config: read from URL querystring, fallback to local dev defaults.
    const _q = new URLSearchParams(window.location.search);
    const _slug    = _q.get('agent_slug')     || 'assistant';
    const _apiUrl  = _q.get('api_url')        || 'http://127.0.0.1:8000';
    const _tenant  = _q.get('tenant')         || '';
    const _idToken = _q.get('identity_token') || null;
    const _authToken = _q.get('auth_token') || null;
    const _authCookieName = _q.get('auth_cookie_name') || null;
    const _authMode = _q.get('auth_mode') || 'anonymous';

    document.getElementById('agentLabel').textContent = _slug;

    // The production snippet, as shown in Settings > Messenger in the dashboard.
    const _scriptUrl = _q.get('script_url') || (window.location.origin + '/chat-widget/bokito-chat.js');
    document.getElementById('embedSnippet').textContent =
      `<script\n  src="${_scriptUrl}"\n  data-bokito-chat-widget\n  data-agent-slug="${_slug}"\n  data-api-url="${_apiUrl}"${_tenant ? `\n  data-tenant="${_tenant}"` : ''}${_authCookieName ? `\n  data-auth-cookie-name="${_authCookieName}"` : ''}\n  data-auth-mode="${_authMode}"\n  defer\n><\/script>`;

    // Pass config to the widget before loading the script.
    window.BokitoConfig = {
      agentSlug: _slug,
      apiUrl: _apiUrl,
      tenant: _tenant || undefined,
      identityToken: _idToken || undefined,
      authToken: _authToken || undefined,
      authCookieName: _authCookieName || undefined,
      authMode: _authMode || undefined,
    };
  </script>

  <!--
    The widget is loaded as an external script - exactly as any website would embed it.
    Locally: after `npm run build`, Vite dev serves dist/bokito-chat.js at /bokito-chat.js.
    In production: served by Caddy at /chat-widget/bokito-chat.js.
  -->
  <script src="/bokito-chat.js" data-bokito-chat-widget defer></script>
</body>
</html>
