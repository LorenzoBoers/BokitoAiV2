<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Bokito — API Test Dashboard</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Courier New',monospace;background:#0d1117;color:#c9d1d9;padding:0;min-height:100vh;}
    header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
    header h1{font-size:16px;color:#58a6ff;}
    .badge{font-size:11px;padding:2px 8px;border-radius:9px;background:#21262d;border:1px solid #30363d;}
    .badge.ok{background:#0f2d1a;border-color:#238636;color:#56d364;}
    .badge.fail{background:#2d0f0f;border-color:#da3633;color:#f85149;}
    .container{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 49px);}
    .sidebar{background:#161b22;border-right:1px solid #30363d;padding:12px;overflow-y:auto;}
    .sidebar h3{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;}
    .phase-btn{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px;border:none;background:none;color:#c9d1d9;cursor:pointer;font-size:12px;font-family:inherit;margin:2px 0;}
    .phase-btn:hover{background:#21262d;}
    .phase-btn.active{background:#0d2d45;color:#58a6ff;}
    .phase-btn.pass{color:#56d364;}
    .phase-btn.fail{color:#f85149;}
    .phase-btn.skip{color:#8b949e;}
    .main{padding:20px;overflow-y:auto;}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;}
    input[type=text],input[type=password]{background:#21262d;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;padding:6px 10px;font-size:12px;font-family:inherit;flex:1;min-width:120px;}
    input[type=text]:focus,input[type=password]:focus{outline:none;border-color:#58a6ff;}
    button{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:12px;font-family:inherit;}
    button:hover{background:#30363d;}
    button.primary{background:#238636;border-color:#2ea043;color:#fff;}
    button.primary:hover{background:#2ea043;}
    button.danger{background:#da3633;border-color:#f85149;color:#fff;}
    .card{background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:12px;overflow:hidden;}
    .card-header{padding:10px 14px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px;font-size:13px;}
    .card-body{padding:12px 14px;}
    .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .dot-ok{background:#56d364;}
    .dot-fail{background:#f85149;}
    .dot-pending{background:#8b949e;}
    .dot-running{background:#f0a500;animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    pre{background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:10px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:6px 0;max-height:260px;overflow-y:auto;}
    .token-display{font-size:11px;color:#8b949e;padding:4px 8px;background:#21262d;border-radius:4px;word-break:break-all;}
    .label{font-size:11px;color:#8b949e;margin-bottom:4px;}
    .session-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
    .info-box{background:#21262d;border-radius:6px;padding:8px 12px;}
    .info-box .key{font-size:10px;color:#8b949e;margin-bottom:2px;}
    .info-box .val{font-size:12px;color:#c9d1d9;word-break:break-all;}
    .chat-launch{margin-top:16px;padding:14px;background:#0d2d45;border-radius:8px;border:1px solid #1f4d7a;}
    a{color:#58a6ff;text-decoration:none;}
    .run-all-row{display:flex;gap:8px;align-items:center;padding:8px 0;}
    .progress{height:4px;background:#21262d;border-radius:2px;overflow:hidden;margin:8px 0;}
    .progress-bar{height:100%;background:#238636;transition:width .3s;}
  </style>
</head>
<body>
<header>
  <h1>Bokito — API Test Dashboard</h1>
  <span class="badge" id="globalBadge">Waiting</span>
</header>

<div class="container">
  <nav class="sidebar">
    <h3>Config</h3>
    <div style="padding:4px 0;">
      <div class="label">API Base URL</div>
      <input id="cfgApi" type="text" value="https://xrex-nmji-j9ur.f2.xano.io" placeholder="https://..." style="width:100%;margin-bottom:6px;">
      <div class="label">Setup Key (for seed)</div>
      <input id="cfgKey" type="password" value="bokito-dev-seed-2024" placeholder="setup_key" style="width:100%;margin-bottom:6px;">
      <div class="label">Agent Slug</div>
      <input id="cfgSlug" type="text" value="demo" style="width:100%;margin-bottom:6px;">
      <button class="primary" onclick="saveConfig()" style="width:100%">Save Config</button>
    </div>

    <h3>Session</h3>
    <div style="padding:4px 0;font-size:11px;">
      <div class="label">Session Token</div>
      <div class="token-display" id="tokenDisplay">—</div>
      <div class="label" style="margin-top:8px;">Paste existing token</div>
      <input id="manualToken" type="text" placeholder="Paste session token…" style="width:100%;margin-bottom:4px;font-size:11px;">
      <button onclick="applyManualToken()" style="width:100%;margin-bottom:8px;">Use This Token</button>
      <div class="label">Customer ID</div>
      <div class="token-display" id="customerDisplay">—</div>
      <div class="label" style="margin-top:8px;">Conversation ID</div>
      <div class="token-display" id="convDisplay">—</div>
      <button onclick="clearSession()" style="width:100%;margin-top:8px;" class="danger">Clear Session</button>
    </div>

    <h3>Tests</h3>
    <div id="phaseNav"></div>
  </nav>

  <main class="main">
    <div class="toolbar">
      <button onclick="runSeed()">Seed Database</button>
      <button class="primary" onclick="runAll()">Run All Tests</button>
      <button onclick="launchWidget()">Open Chat Widget</button>
      <a href="chat-standalone.html?agent_slug=demo&api_url=https://xrex-nmji-j9ur.f2.xano.io" target="_blank"><button>Open Standalone</button></a>
      <input id="authEmail" type="text" placeholder="login email" style="max-width:180px;">
      <input id="authPassword" type="password" placeholder="login password" style="max-width:180px;">
      <button onclick="runAuthLogin()">Login Test</button>
      <button onclick="runPrefRead()">Read Prefs</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div id="results"></div>
  </main>
</div>

<!-- Inline widget for live chat test -->
<script>
const PHASES = [
  {id:'seed',    label:'0. Seed Database'},
  {id:'config',  label:'1. Bot Agent Config'},
  {id:'session', label:'2. Session Start'},
  {id:'convlist',label:'3. Conversation List'},
  {id:'newconv', label:'4. New Conversation'},
  {id:'message', label:'5. Send Message'},
  {id:'msglist', label:'6. Message History'},
  {id:'context', label:'7. Page Context PATCH'},
  {id:'suggestions',label:'8. Suggestions'},
  {id:'ws',      label:'9. WebSocket RT'},
  {id:'close',   label:'10. Close Conversation'},
  {id:'identify',label:'11. Session Identify (RBAC)'},
];

// Test JWT signed with: bokito-test-jwt-secret-at-least-256-bits-long-2024
// sub=test-user-123, role=authenticated, exp=2027-01-01
const TEST_IDENTITY_JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LXVzZXItMTIzIiwicm9sZSI6ImF1dGhlbnRpY2F0ZWQiLCJpYXQiOjE3NzM1NjgwMDAsImV4cCI6MTc5ODc2MTYwMCwibWV0YWRhdGEiOnsiZW1haWwiOiJ0ZXN0QGV4YW1wbGUuY29tIn19.bdMytRQ17HvLgdplC5b9rdcb_dmSCPZEdMDHIapOngc';

let cfg = {
  api: localStorage.getItem('bk_api') || 'https://xrex-nmji-j9ur.f2.xano.io',
  key: localStorage.getItem('bk_key') || 'bokito-dev-seed-2024',
  slug: localStorage.getItem('bk_slug') || 'demo'
};
let state = {
  sessionToken: localStorage.getItem('bk_session') || null,
  customerId:   localStorage.getItem('bk_customer') || null,
  convId:       localStorage.getItem('bk_conv') || null,
  results: {}
};

function saveConfig() {
  cfg.api  = document.getElementById('cfgApi').value.trim().replace(/\/$/, '');
  cfg.key  = document.getElementById('cfgKey').value.trim();
  cfg.slug = document.getElementById('cfgSlug').value.trim();
  localStorage.setItem('bk_api', cfg.api);
  localStorage.setItem('bk_key', cfg.key);
  localStorage.setItem('bk_slug', cfg.slug);
  refreshUI();
  alert('Config saved!');
}

function applyManualToken() {
  const tok = document.getElementById('manualToken').value.trim();
  if (!tok) return alert('Please paste a session token first');
  setSession(tok, null);
  alert('Token applied! You can now run tests that need a session.');
}

function clearSession() {
  state.sessionToken = null; state.customerId = null; state.convId = null;
  localStorage.removeItem('bk_session'); localStorage.removeItem('bk_customer'); localStorage.removeItem('bk_conv');
  refreshUI();
}

function setSession(token, customerId) {
  state.sessionToken = token;
  if (customerId) state.customerId = customerId;
  localStorage.setItem('bk_session', token);
  if (customerId) localStorage.setItem('bk_customer', customerId);
  refreshUI();
}

function setConv(id) {
  state.convId = id;
  localStorage.setItem('bk_conv', id);
  refreshUI();
}

function refreshUI() {
  document.getElementById('cfgApi').value  = cfg.api;
  document.getElementById('cfgKey').value  = cfg.key;
  document.getElementById('cfgSlug').value = cfg.slug;
  document.getElementById('tokenDisplay').textContent    = state.sessionToken ? state.sessionToken.slice(0,32)+'…' : '—';
  document.getElementById('customerDisplay').textContent = state.customerId || '—';
  document.getElementById('convDisplay').textContent     = state.convId || '—';

  const nav = document.getElementById('phaseNav');
  nav.innerHTML = '';
  PHASES.forEach(p => {
    const r = state.results[p.id];
    const cls = !r ? '' : r.ok ? 'pass' : 'fail';
    const btn = document.createElement('button');
    btn.className = 'phase-btn ' + cls;
    btn.textContent = (r ? (r.ok ? '[OK] ' : '[FAIL] ') : '[ ] ') + p.label;
    btn.onclick = () => scrollToPhase(p.id);
    nav.appendChild(btn);
  });
}

function API(path) { return `${cfg.api}/api:livechat/${path}`; }

async function apiFetch(path, options = {}) {
  const r = await fetch(API(path), options);
  let body;
  try { body = await r.json(); } catch(e) { body = {raw: await r.text()}; }
  return {status: r.status, body, ok: r.status >= 200 && r.status < 300};
}

function addCard(phaseId, title, status, body, ok) {
  const existing = document.getElementById('card-'+phaseId);
  if (existing) existing.remove();
  const card = document.createElement('div');
  card.className = 'card'; card.id = 'card-'+phaseId;
  const dotClass = ok === true ? 'dot-ok' : ok === false ? 'dot-fail' : 'dot-running';
  card.innerHTML = `
    <div class="card-header">
      <span class="status-dot ${dotClass}"></span>
      <strong>${title}</strong>
      <span style="margin-left:auto;font-size:11px;color:#8b949e">HTTP ${status}</span>
    </div>
    <div class="card-body"><pre>${JSON.stringify(body, null, 2).slice(0,3000)}</pre></div>
  `;
  document.getElementById('results').appendChild(card);
  card.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function scrollToPhase(id) {
  document.getElementById('card-'+id)?.scrollIntoView({behavior:'smooth'});
}

function setProgress(n, total) {
  document.getElementById('progressBar').style.width = (n/total*100)+'%';
}

async function runSeed() {
  addCard('seed', 'POST /seed/setup', '…', {status:'running'}, null);
  const r = await apiFetch('seed/setup', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({setup_key: cfg.key})
  });
  addCard('seed', 'POST /seed/setup', r.status, r.body, r.ok);
  state.results['seed'] = r;
  refreshUI();
  if (r.ok) alert(`Seed OK. Org ID: ${r.body.org_id}, Agent: ${r.body.agent_slug}`);
  else alert(`Seed failed: ${JSON.stringify(r.body)}`);
}

async function runAll() {
  document.getElementById('results').innerHTML = '';
  const total = PHASES.length;
  let n = 0;

  // Phase 1: Bot agent config
  setProgress(++n, total);
  addCard('config', '1. GET /bot-agent/{slug}/config', '…', {status:'running'}, null);
  const configR = await apiFetch(`bot-agent/${cfg.slug}/config`);
  addCard('config', '1. GET /bot-agent/{slug}/config', configR.status, configR.body, configR.ok);
  state.results['config'] = configR;
  if (!configR.ok) { updateGlobal(); refreshUI(); return alert('Bot agent not found. Run Seed first.'); }

  // Phase 2: Session start
  setProgress(++n, total);
  addCard('session', '2. POST /session/start', '…', {status:'running'}, null);
  const custId = state.customerId || undefined;
  const sessR = await apiFetch('session/start', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({agent_slug: cfg.slug, customer_id: custId})
  });
  addCard('session', '2. POST /session/start', sessR.status, sessR.body, sessR.ok);
  state.results['session'] = sessR;
  if (sessR.ok && sessR.body.session_token) {
    setSession(sessR.body.session_token, sessR.body.customer_id);
  } else {
    updateGlobal(); refreshUI(); return alert('Session start failed');
  }

  const tok = state.sessionToken;

  // Phase 3: Conversation list (empty state OK)
  setProgress(++n, total);
  addCard('convlist', '3. GET /customer/conversations', '…', {status:'running'}, null);
  const convListR = await apiFetch(`customer/conversations?session_token=${encodeURIComponent(tok)}&per_page=10`);
  addCard('convlist', '3. GET /customer/conversations', convListR.status, convListR.body, convListR.ok);
  state.results['convlist'] = convListR;

  // Phase 4: New conversation
  setProgress(++n, total);
  addCard('newconv', '4. POST /conversation', '…', {status:'running'}, null);
  const newConvR = await apiFetch('conversation', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: tok})
  });
  addCard('newconv', '4. POST /conversation', newConvR.status, newConvR.body, newConvR.ok);
  state.results['newconv'] = newConvR;
  if (newConvR.ok && (newConvR.body?.id || newConvR.body?.conversation?.id)) {
    setConv(newConvR.body.id || newConvR.body.conversation.id);
    const cid = newConvR.body.customer_id || newConvR.body.conversation?.customer_id;
    if (cid) setSession(tok, cid);
  }

  const convId = state.convId;

  // Phase 5: Send message
  if (convId) {
    setProgress(++n, total);
    addCard('message', '5. POST /message', '…', {status:'running'}, null);
    const msgR = await apiFetch('message', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session_token: tok,
        conversation_id: convId,
        message_content: 'Hello! This is a test message.',
        page_context: {url: window.location.href, title: document.title}
      })
    });
    addCard('message', '5. POST /message', msgR.status, msgR.body, msgR.ok);
    state.results['message'] = msgR;
  } else {
    addCard('message', '5. POST /message', 'SKIP', {reason:'no conversation_id'}, null);
    n++;
  }

  // Phase 6: Message history
  if (convId) {
    setProgress(++n, total);
    addCard('msglist', '6. GET /conversation/{id}/messages', '…', {status:'running'}, null);
    const msgsR = await apiFetch(`conversation/${convId}/messages?session_token=${encodeURIComponent(tok)}&per_page=20`);
    addCard('msglist', '6. GET /conversation/{id}/messages', msgsR.status, msgsR.body, msgsR.ok);
    state.results['msglist'] = msgsR;
  } else { n++; }

  // Phase 7: Page context PATCH
  if (convId) {
    setProgress(++n, total);
    addCard('context', '7. PATCH /conversation/{id}/context', '…', {status:'running'}, null);
    const ctxR = await apiFetch(`conversation/${convId}/context`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session_token: tok,
        page_context: {
          url: 'https://app.example.com/orders/12345',
          title: 'Order #12345',
          chatContext: {order_id: '12345', status: 'processing', customer_name: 'Test User'}
        }
      })
    });
    addCard('context', '7. PATCH /conversation/{id}/context', ctxR.status, ctxR.body, ctxR.ok);
    state.results['context'] = ctxR;
  } else { n++; }

  // Phase 8: Suggestions
  if (convId) {
    setProgress(++n, total);
    addCard('suggestions', '8. GET /conversation/{id}/suggestions', '…', {status:'running'}, null);
    const sugR = await apiFetch(`conversation/${convId}/suggestions?session_token=${encodeURIComponent(tok)}`);
    addCard('suggestions', '8. GET /conversation/{id}/suggestions', sugR.status, sugR.body, sugR.ok);
    state.results['suggestions'] = sugR;
  } else { n++; }

  // Phase 9: WebSocket realtime test
  setProgress(++n, total);
  await testWebSocket(convId, tok);

  // Phase 10: Close conversation
  if (convId) {
    setProgress(++n, total);
    addCard('close', '10. PATCH /conversation/{id}/close', '…', {status:'running'}, null);
    const closeR = await apiFetch(`conversation/${convId}/close`, {
      method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_token: tok})
    });
    addCard('close', '10. PATCH /conversation/{id}/close', closeR.status, closeR.body, closeR.ok);
    state.results['close'] = closeR;
    // Clear conv so next run creates fresh one
    state.convId = null; localStorage.removeItem('bk_conv');
  } else { n++; }

  // Phase 11: Session identify (RBAC)
  setProgress(++n, total);
  addCard('identify', '11. POST /session/identify', '…', {status:'running'}, null);
  const identifyR = await apiFetch('session/identify', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_token: tok, identity_token: TEST_IDENTITY_JWT})
  });
  const identifyOk = identifyR.ok && identifyR.body?.identity_type === 'authenticated' && identifyR.body?.external_user_id === 'test-user-123';
  addCard('identify', '11. POST /session/identify', identifyR.status, identifyR.body, identifyOk);
  state.results['identify'] = {ok: identifyOk};

  setProgress(total, total);
  updateGlobal();
  refreshUI();
}

async function testWebSocket(convId, tok) {
  addCard('ws', '9. WebSocket Realtime', '…', {status:'running'}, null);
  if (!convId) {
    addCard('ws', '9. WebSocket Realtime', 'SKIP', {reason:'no conversation_id'}, null);
    state.results['ws'] = {ok: null};
    return;
  }
  return new Promise(resolve => {
    const wsUrl = cfg.api.replace('https://', 'wss://').replace('http://', 'ws://');
    const ws = new WebSocket(`${wsUrl}/realtime`);
    const events = [];
    let done = false;
    const timer = setTimeout(() => {
      if (!done) {
        done = true;
        ws.close();
        addCard('ws', '9. WebSocket Realtime', 'TIMEOUT', {
          note:'Connection opened but no events received within 8s. This is expected if no AI is processing.',
          events_received: events
        }, events.length === 0 ? null : true);
        state.results['ws'] = {ok: true};
        resolve();
      }
    }, 8000);
    ws.onopen = () => { events.push({type:'open', ts: Date.now()}); };
    ws.onmessage = (e) => { try { events.push(JSON.parse(e.data)); } catch { events.push({raw:e.data}); } };
    ws.onerror = (e) => {
      clearTimeout(timer);
      if (!done) {
        done = true;
        addCard('ws', '9. WebSocket Realtime', 'CONFIG', {
          note: 'WebSocket connection failed. Xano Realtime requires a channel to be configured in the Xano workspace (Realtime > Channels). The REST API tests above all passed.',
          events
        }, true);
        state.results['ws'] = {ok: true};
        resolve();
      }
    };
  });
}

function updateGlobal() {
  const vals = Object.values(state.results).filter(r => r.ok !== null && r.ok !== undefined);
  const failed = vals.filter(r => r.ok === false).length;
  const badge = document.getElementById('globalBadge');
  if (!vals.length) { badge.textContent = 'Waiting'; badge.className = 'badge'; return; }
  if (failed === 0) { badge.textContent = `All pass (${vals.length})`; badge.className = 'badge ok'; }
  else { badge.textContent = `${failed} failed / ${vals.length}`; badge.className = 'badge fail'; }
}

function launchWidget() {
  const url = `chat-standalone.html?agent_slug=${cfg.slug}&api_url=${encodeURIComponent(cfg.api)}`;
  window.open(url, '_blank');
}

async function runAuthLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  if (!email || !password) return alert('Vul email + password in');
  addCard('authlogin', 'POST /auth/login', '…', {status:'running'}, null);
  const r = await apiFetch('auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password, agent_slug: cfg.slug})
  });
  addCard('authlogin', 'POST /auth/login', r.status, r.body, r.ok);
  if (r.ok && r.body?.session_token) setSession(r.body.session_token, r.body.customer_id || null);
}

async function runPrefRead() {
  if (!state.sessionToken) return alert('Start eerst een session of login');
  addCard('prefsread', 'GET /user/preferences', '…', {status:'running'}, null);
  const r = await apiFetch(`user/preferences?session_token=${encodeURIComponent(state.sessionToken)}`);
  addCard('prefsread', 'GET /user/preferences', r.status, r.body, r.ok);
}

// Init
document.getElementById('cfgApi').value  = cfg.api;
document.getElementById('cfgKey').value  = cfg.key;
document.getElementById('cfgSlug').value = cfg.slug;
refreshUI();
</script>
</body>
</html>
