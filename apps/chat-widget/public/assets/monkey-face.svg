<style>
  .bk-lid-shape{fill:#00FF99;transform-box:fill-box;opacity:0;}
  .bk-lid-top{transform-origin:center bottom;animation:bkLidTop 6s cubic-bezier(.4,0,.2,1) infinite;}
  .bk-lid-bottom{transform-origin:center top;animation:bkLidBottom 6s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes bkLidTop{
    0%,84%,100%{transform:scaleY(0);opacity:0;}
    88%,90%{transform:scaleY(1);opacity:1;}
    92.5%{transform:scaleY(0);opacity:0;}
  }
  @keyframes bkLidBottom{
    0%,84%,100%{transform:scaleY(0);opacity:0;}
    88%,90%{transform:scaleY(1);opacity:1;}
    92.5%{transform:scaleY(0);opacity:0;}
  }
</style>
